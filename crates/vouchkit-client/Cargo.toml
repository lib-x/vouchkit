[package]
name = "vouchkit-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Activation and lease-renewal client with device key storage for vouchkit."
readme = "README.md"

[lints]
workspace = true

[dependencies]
vouchkit-core.workspace = true
async-trait.workspace = true
fs2.workspace = true
postcard.workspace = true
serde.workspace = true
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[features]
reqwest = ["dep:reqwest", "dep:serde_json"]
keyring = ["dep:keyring"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["windows-native"] }

[dev-dependencies]
tokio.workspace = true
