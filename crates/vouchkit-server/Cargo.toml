[package]
name = "vouchkit-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference activation server for vouchkit, running on a delegated key."
readme = "README.md"

[lints]
workspace = true

[dependencies]
vouchkit-core.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
hex.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"], optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
base64.workspace = true
vouchkit-client = { workspace = true, features = ["reqwest"] }
reqwest.workspace = true
tempfile.workspace = true

[[bin]]
name = "vouchkit-server"
path = "src/main.rs"
