[package]
name = "vouchkit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
vouchkit-core = { path = "../crates/vouchkit-core" }

[[bin]]
name = "token"
path = "fuzz_targets/token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crl"
path = "fuzz_targets/crl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delegation"
path = "fuzz_targets/delegation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "activation"
path = "fuzz_targets/activation.rs"
test = false
doc = false
bench = false
